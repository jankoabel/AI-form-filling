[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "formfill"
version = "1.0.0"
description = "AI assistant that fills in .docx forms through a conversation and returns a PDF"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "python-docx>=1.1",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
formfill = "formfill.cli:app"

[tool.setuptools.packages.find]
include = ["formfill*"]

[tool.setuptools.package-data]
formfill = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
