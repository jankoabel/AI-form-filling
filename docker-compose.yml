services:
  api:
    build: .
    image: aiteam-form-filler
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      # SQLite in the volume by default; for PostgreSQL run: docker compose --profile postgres up
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/formfill.db}
    volumes:
      - formfill-data:/data
      - ./forms:/forms:ro
    restart: unless-stopped

  # Optional PostgreSQL (set DATABASE_URL=postgresql+psycopg://formfill:formfill@db:5432/formfill in .env)
  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: formfill
      POSTGRES_PASSWORD: formfill
      POSTGRES_DB: formfill
    volumes:
      - pg-data:/var/lib/postgresql/data

volumes:
  formfill-data:
  pg-data:
